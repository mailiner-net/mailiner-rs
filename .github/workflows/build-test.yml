name: Build & Test

on:
  pull_request:
  push:
    # main is covered by Build & Deploy, which calls this workflow
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: "0.7.9"

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (libraries)
        run: >
          cargo clippy --locked --all-targets
          -p mailiner-core
          -p mailiner-mime
          -p mailiner-html
          -p mailiner-imap-connector
          -p mailiner-smtp-connector
          -p mailiner-composer
          -p mailiner-pgp
          -- -D warnings -A dead_code

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: cargo check
        run: cargo check --workspace --locked --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Run workspace tests
        run: cargo test --workspace --locked

  build:
    name: Build mailiner-app (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install dioxus-cli
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/dx
          dx --version

      - name: Build mailiner-app (release web)
        run: dx build -p mailiner-app --release --web --debug-symbols=false --locked

      - name: Prepare public directory
        run: |
          set -euo pipefail
          PUBLIC_DIR="target/dx/mailiner-app/release/web/public"
          test -f "$PUBLIC_DIR/index.html"
          # Dioxus copies crates/mailiner-app/public/ as-is (stable PWA paths).
          test -f "$PUBLIC_DIR/manifest.webmanifest"
          test -f "$PUBLIC_DIR/sw.js"
          test -f "$PUBLIC_DIR/icons/icon-192.png"
          test -f "$PUBLIC_DIR/icons/icon-512.png"
          test -f "$PUBLIC_DIR/icons/icon-maskable-192.png"
          test -f "$PUBLIC_DIR/icons/icon-maskable-512.png"
          test -f "$PUBLIC_DIR/icons/apple-touch-icon.png"
          # SPA fallback for Dioxus client-side routing on Cloudflare Pages.
          # Existing files (sw.js, manifest, icons) are served before redirects.
          printf '/*    /index.html   200\n' > "$PUBLIC_DIR/_redirects"
          # Same policy as CONTENT_SECURITY_POLICY in crates/mailiner-app/src/main.rs.
          # Cloudflare Pages custom headers:
          # https://developers.cloudflare.com/pages/configuration/headers/
          python3 -c 'import pathlib, re, sys
          src = pathlib.Path("crates/mailiner-app/src/main.rs").read_text()
          match = re.search(r"const CONTENT_SECURITY_POLICY:\s*&str\s*=\s*\"(.*?)\";", src, re.S)
          if not match:
              sys.exit("CONTENT_SECURITY_POLICY not found in main.rs")
          policy = match.group(1).replace("\\\n", "")
          if "\\" in policy or "\n" in policy:
              sys.exit("unexpected CONTENT_SECURITY_POLICY escaping: %r" % (policy,))
          if "default-src '\''self'\''" not in policy:
              sys.exit("unexpected CONTENT_SECURITY_POLICY: %r" % (policy,))
          headers = pathlib.Path("target/dx/mailiner-app/release/web/public/_headers")
          headers.write_text(
              "# Same policy as CONTENT_SECURITY_POLICY in crates/mailiner-app/src/main.rs\n"
              "/*\n"
              "  Content-Security-Policy: %s\n"
              "\n"
              "# Always revalidate the service worker so updates are not stuck.\n"
              "/sw.js\n"
              "  Cache-Control: no-cache\n"
              "\n"
              "/manifest.webmanifest\n"
              "  Content-Type: application/manifest+json\n" % (policy,)
          )
          print("Wrote", headers, "CSP:")
          print(policy)
          '
          test -f "$PUBLIC_DIR/_redirects"
          test -f "$PUBLIC_DIR/_headers"
          echo "Build tree:"
          find "$PUBLIC_DIR" -type f | head -50

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-public
          path: target/dx/mailiner-app/release/web/public
          retention-days: 7

  e2e:
    name: Playwright e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-public
          path: e2e-public

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
          MAILINER_E2E_SERVE_DIR: e2e-public
          MAILINER_E2E_PORT: "8080"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-live:
    name: Playwright e2e (docker-mail)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ws-tcp-proxy
        uses: actions/checkout@v4
        with:
          repository: mailiner-net/ws-tcp-proxy
          path: ws-tcp-proxy

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-public
          path: e2e-public

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start mail + proxy
        env:
          WS_TCP_PROXY_CONTEXT: ${{ github.workspace }}/ws-tcp-proxy
        run: docker compose up --build --wait --detach

      - name: Run live Playwright tests
        env:
          CI: true
          MAILINER_E2E_SERVE_DIR: e2e-public
          MAILINER_E2E_PORT: "8080"
        run: npm run test:e2e:live

      - name: Proxy and mail logs
        if: ${{ !cancelled() }}
        run: docker compose logs --no-color --tail=200

      - name: Stop compose
        if: ${{ always() }}
        run: docker compose down -v

      - name: Upload live Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload live Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-live
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
