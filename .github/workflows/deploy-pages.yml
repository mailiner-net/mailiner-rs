name: Build & Deploy (Cloudflare Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # build.rs currently requires IMAP_PASSWORD at compile time (dev placeholder).
  IMAP_PASSWORD: ci-placeholder
  DX_VERSION: "0.7.9"

jobs:
  build-and-deploy:
    name: Build mailiner-app & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install dioxus-cli
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/dx
          dx --version

      - name: Build mailiner-app (release web)
        run: dx build -p mailiner-app --release --web --locked

      - name: Prepare deploy directory
        run: |
          set -euo pipefail
          PUBLIC_DIR="target/dx/mailiner-app/release/web/public"
          test -f "$PUBLIC_DIR/index.html"
          # SPA fallback for Dioxus client-side routing on Cloudflare Pages
          printf '/*    /index.html   200\n' > "$PUBLIC_DIR/_redirects"
          echo "Deploy tree:"
          find "$PUBLIC_DIR" -type f | head -50

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy target/dx/mailiner-app/release/web/public
            --project-name=mailiner-dev
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
