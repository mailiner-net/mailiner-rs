[workspace]
resolver = "2"
members = [
    "crates/mailiner-app",
    "crates/mailiner-core",
    "crates/mailiner-imap-connector",
    "crates/mailiner-smtp-connector",
    "crates/mailiner-mime",
    "crates/mailiner-composer",
    "crates/mailiner-html",
    "crates/mailiner-pgp"
]

[workspace.dependencies]
tokio = { version = "1.47", default-features = false, features = [ "rt", "time" ] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

# Used by `dx build --release --web`. Size-oriented; host `cargo test` stays
# on the default `release` profile (no fat LTO).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
