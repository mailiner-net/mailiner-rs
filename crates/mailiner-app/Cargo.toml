[package]
name = "mailiner-app"
version = "0.1.0"
authors = ["Daniel Vrátil <me@dvratil.cz>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mailiner_app"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-heroicons = "0.4.1"
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1.18", features = ["v4", "js"] }
mailiner-core = { path = "../mailiner-core" }
mailiner-mime = { path = "../mailiner-mime" }
ammonia = "4.0"
linkify = "0.10"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
percent-encoding = "2"

mailiner-imap-connector = { path = "../mailiner-imap-connector" }
send_wrapper = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "CloseEvent",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "MessageEvent",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Url",
    "WebSocket",
    "Window",
] }
tokio = { workspace = true }

[build-dependencies]
dotenv = "0.15"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Enable interim dev_default_config() in release builds (also on under debug_assertions).
dev-defaults = []
