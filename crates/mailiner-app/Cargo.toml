[package]
name = "mailiner-app"
version = "0.1.0"
authors = ["Daniel Vrátil <me@dvratil.cz>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mailiner_app"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7.9", default-features = false, features = [
    "launch",
    "lib",
    "logger",
    "router",
    "web",
] }
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1.18", features = ["v4", "js"] }
mailiner-core = { path = "../mailiner-core" }
mailiner-mime = { path = "../mailiner-mime" }
ammonia = "4.0"
linkify = "0.10"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
percent-encoding = "2"
sha2 = "0.10"

mailiner-imap-connector = { path = "../mailiner-imap-connector" }
mailiner-smtp-connector = { path = "../mailiner-smtp-connector" }
mailiner-composer = { path = "../mailiner-composer", features = ["web"] }
mailiner-pgp = { path = "../mailiner-pgp" }
futures-channel = "0.3"
futures-executor = "0.3"
wasm-bindgen-futures = "0.4"
send_wrapper = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "CloseEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "CssStyleDeclaration",
    "Document",
    "EventTarget",
    "File",
    "FileList",
    "DomParser",
    "DomRect",
    "DomStringList",
    "Element",
    "Event",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlIFrameElement",
    "HtmlImageElement",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "Node",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "NodeList",
    "Response",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "ScrollBehavior",
    "ScrollToOptions",
    "ServiceWorkerContainer",
    "AesGcmParams",
    "AesKeyGenParams",
    "Crypto",
    "CryptoKey",
    "Pbkdf2Params",
    "Storage",
    "SubtleCrypto",
    "SupportedType",
    "Url",
    "WebSocket",
    "Window",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "UrlSearchParams",
] }
tokio = { workspace = true }

# Host-only AES-GCM + PBKDF2 so unit tests exercise the same vault format.
# The WASM build uses WebCrypto instead (smaller binary, browser-audited).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Prefill onboarding form fields in release builds (also on under debug_assertions).
# Does not auto-connect or write the account store.
dev-defaults = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
