[application]

[web.app]

# HTML title tag content
title = "Mailiner"

# Leave base_path unset so the default site stays at the host root.
# A subpath deploy passes `--base-path /app` (or MAILINER_WEB_BASE_PATH in CI).
# Setting it here would bake that prefix into every `dx serve` and release.

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

# Content-Security-Policy is set in-app via document::Meta (CONTENT_SECURITY_POLICY
# in shell.rs) for local `dx serve`. Dioxus.toml has no first-class CSP field.
# Cloudflare Pages deploy also sends the same policy as an HTTP header
# (`_headers` in the built public dir). See README "Content-Security-Policy".
#
# PWA files (manifest, sw.js, icons) live in this crate's `public/` directory
# and are copied as-is to the web output (stable paths, not asset-hashed).
#
# index.html next to this file replaces the dx-generated shell for both
# `dx serve` and release. It paints the boot splash before WASM. Keep
# `<div id="main">` and `</body>` so dx can mount and inject the module script.

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

# Release wasm-opt. `debug = false` is required: DWARF makes the official
# binaryen build abort (`compile unit size was incorrect`), so dx would
# otherwise ship the unoptimized 6.7 MB file.
[web.wasm_opt]
level = "s"
debug = false
