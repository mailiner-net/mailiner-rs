<!DOCTYPE html>
<!--
  Custom dx shell (dev and release). Replaces the CLI's default index.html.

  The boot splash paints with this document, before the WASM module is
  downloaded. It sits outside #main; Dioxus mounts into #main and does not
  remove siblings. App() removes #mailiner-splash after the first commit.

  Keep the mount node (id main) and a literal end-body tag so dx can inject
  the module script. dx replaces the app-title, base-path, and style-include
  tokens everywhere they occur, including comments, so those tokens stay in
  the slots below and nowhere else.

  The inline #mailiner-splash-theme script is allow-listed by sha256 in
  CONTENT_SECURITY_POLICY. Do not add other inline scripts.

  Hot reload stays available: the debug WASM opens its own socket to dx.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <title>{app_title}</title>
        <link rel="icon" href="/{base_path}/icons/icon-192.png" type="image/png">
        <style>
            /* Zero specificity so main.css body colors win after mount.
               These only paint the document while the splash is up. */
            :where(html, body) {
                background: #f4f1ea;
                color-scheme: light;
            }

            #mailiner-splash {
                background: #f4f1ea;
                color: #171717;
                color-scheme: light;
            }

            @media (prefers-color-scheme: dark) {
                :where(html:not([data-theme="light"]), html:not([data-theme="light"]) body) {
                    background: #121212;
                    color-scheme: dark;
                }

                html:not([data-theme="light"]) #mailiner-splash {
                    background: #121212;
                    color: #e8e8e8;
                    color-scheme: dark;
                }

                html:not([data-theme="light"]) .mailiner-splash-status {
                    color: #b9b9b9;
                }

                html:not([data-theme="light"]) .mailiner-splash-bar {
                    background: #2e2e2e;
                }

                html:not([data-theme="light"]) .mailiner-splash-bar > span {
                    background: #9cc7f7;
                }

                html:not([data-theme="light"]) #mailiner-splash::before {
                    background: #ff7a96;
                }
            }

            :where(html[data-theme="dark"], html[data-theme="dark"] body) {
                background: #121212;
                color-scheme: dark;
            }

            html[data-theme="dark"] #mailiner-splash {
                background: #121212;
                color: #e8e8e8;
                color-scheme: dark;
            }

            :where(html[data-theme="light"], html[data-theme="light"] body) {
                background: #f4f1ea;
                color-scheme: light;
            }

            html[data-theme="light"] #mailiner-splash {
                background: #f4f1ea;
                color: #171717;
                color-scheme: light;
            }

            html,
            body {
                margin: 0;
                padding: 0;
            }

            #mailiner-splash {
                position: fixed;
                inset: 0;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.65rem;
                font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
            }

            #mailiner-splash::before {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                left: 0;
                height: 2px;
                background: #ee4266;
            }

            html[data-theme="dark"] #mailiner-splash::before {
                background: #ff7a96;
            }

            .mailiner-splash-mark {
                width: 4.5rem;
                height: auto;
            }

            .mailiner-splash-mark svg {
                display: block;
                width: 100%;
                height: auto;
            }

            .mailiner-splash-title {
                margin: 0.15rem 0 0;
                font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
                font-size: 1.75rem;
                font-weight: 500;
                letter-spacing: -0.03em;
            }

            .mailiner-splash-status {
                margin: 0;
                font-size: 0.9rem;
                color: #454545;
            }

            html[data-theme="dark"] .mailiner-splash-status {
                color: #b9b9b9;
            }

            html[data-theme="light"] .mailiner-splash-status {
                color: #454545;
            }

            .mailiner-splash-bar {
                width: 8.5rem;
                height: 3px;
                margin-top: 0.35rem;
                border-radius: 999px;
                background: #e0dacf;
                overflow: hidden;
            }

            html[data-theme="dark"] .mailiner-splash-bar {
                background: #2e2e2e;
            }

            html[data-theme="light"] .mailiner-splash-bar {
                background: #e0dacf;
            }

            .mailiner-splash-bar > span {
                display: block;
                height: 100%;
                width: 40%;
                border-radius: inherit;
                background: #0b57a4;
                animation: mailiner-splash-slide 1.15s ease-in-out infinite;
            }

            html[data-theme="dark"] .mailiner-splash-bar > span {
                background: #9cc7f7;
            }

            html[data-theme="light"] .mailiner-splash-bar > span {
                background: #0b57a4;
            }

            @keyframes mailiner-splash-slide {
                from { transform: translateX(-120%); }
                to { transform: translateX(280%); }
            }

            @media (prefers-reduced-motion: reduce) {
                .mailiner-splash-bar > span {
                    animation: none;
                    width: 100%;
                    opacity: 0.55;
                }
            }
        </style>
        <!-- One line on purpose: production CSP hashes these exact bytes. -->
        <script id="mailiner-splash-theme">(function(){var theme=null;try{theme=localStorage.getItem("mailiner.ui.theme");}catch(e){}var root=document.documentElement;if(theme==="dark"||theme==="light"){root.setAttribute("data-theme",theme);}else{root.removeAttribute("data-theme");}})();</script>
        {style_include}
    </head>
    <body>
        <div id="mailiner-splash" role="status">
            <div class="mailiner-splash-mark">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115.661 76.309" width="72" height="48" aria-hidden="true">
                    <path fill="#a2deeb" d="M0 23.311a4.072 4.072 0 0 1 4.072-4.072c1.187 0 1.864.451 2.996 1.32 11.576 8.91 48.078 38.978 48.078 38.978 1.477 1.187 3.892 1.187 5.369 0 0 0 36.55-29.702 48.264-39.168.787-.635 1.72-1.13 2.812-1.13 2.206 0 4 1.76 4.064 3.951l.006 4.904v44.77a3.453 3.453 0 0 1-3.443 3.445H3.443A3.453 3.453 0 0 1 0 72.864V25.96Z"/>
                    <path fill="#ee4266" d="M57.83 50.782c-1.765-.023-2.857-.884-3.63-1.489C41.807 39.625 4.51 8.141 4.51 8.141l.01-.032a4.567 4.567 0 0 1-1.672-3.536c0-2.358 1.787-4.3 4.083-4.546L6.94 0h101.783l.008.027a4.576 4.576 0 0 1 4.083 4.546 4.568 4.568 0 0 1-1.672 3.536l.01.032S76.197 36.65 61.404 49.293c-.673.575-1.947 1.511-3.574 1.489z"/>
                </svg>
            </div>
            <p class="mailiner-splash-title">Mailiner</p>
            <p class="mailiner-splash-status mailiner-splash-loading">Loading…</p>
            <div class="mailiner-splash-bar mailiner-splash-loading" aria-hidden="true"><span></span></div>
            <noscript>
                <style>
                    .mailiner-splash-loading { display: none; }
                </style>
                <p class="mailiner-splash-status">Mailiner needs JavaScript to start.</p>
            </noscript>
        </div>
        <div id="main"></div>
    </body>
</html>
