[package]
name = "mailiner-composer"
version = "0.1.0"
edition = "2021"
description = "Email draft model, plain/rich body editors, and composer shell for Mailiner"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
mailiner-core = { path = "../mailiner-core" }
mailiner-html = { path = "../mailiner-html" }
regex = "1"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "js"] }

[features]
default = []
web = []
