[package]
name = "mailiner-imap-connector"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-channel = "2"
async-compression = { version = "0.4", default-features = false, features = ["deflate", "tokio"] }
async-imap = { git = "https://github.com/mailiner-net/async-imap", branch = "main", default-features = false, features = ["runtime-tokio"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls = { version = "0.23.45", default-features = false, features = [ "tls12", "std", "ring" ] }
ring = { version = "0.17", features = [ "wasm32_unknown_unknown_js" ]}
rustls-pki-types = { version = "1.15", features = [ "web" ] }
async-trait = "0.1"
chrono = "0.4"
thiserror = "2.0"
futures = "0.3"
imap-proto = "0.16"
mail-parser = "0.10"
mailiner-core = { path = "../mailiner-core" }
mailiner-mime = { path = "../mailiner-mime" } 
uuid = { version = "1.27", features = ["js"] }
webpki-roots = "1"
tracing = { version = "0.1" }
web-time = "1.1"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
mailiner-smtp-connector = { path = "../mailiner-smtp-connector" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

[features]
# Trust docker/mail/tls/ca.crt (the local Dovecot/Postfix container).
# Enabled automatically in debug builds; wire this from mailiner-app's
# `dev-defaults` so release-with-prefill can still talk to the container.
local-ca = []
