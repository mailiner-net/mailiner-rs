# Local-development Dovecot. Not for production.
auth_mechanisms = plain login
auth_username_format = %Lu
disable_plaintext_auth = yes
# LOGIN/PLAIN over IMAPS (993) / STARTTLS.
ssl = required
ssl_cert = </etc/ssl/mail/server-chain.crt
ssl_key = </etc/ssl/mail/server.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

protocols = imap lmtp
listen = *, ::
base_dir = /run/dovecot

log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr
auth_verbose = yes

mail_home = /var/mail/vmail/%n
mail_location = maildir:~/Maildir
mail_uid = mailiner
mail_gid = mailiner
first_valid_uid = 5000
first_valid_gid = 5000
mail_privileged_group = mailiner

# RFC 5256 SORT is built into Dovecot IMAP.

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0660
    user = mailiner
    group = mailiner
  }
}

service auth-worker {
  # Must stay root: entrypoint.sh writes /etc/dovecot/users as root 0600.
  user = root
}

protocol imap {
  mail_max_userip_connections = 50
}
